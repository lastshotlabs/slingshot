version: 2

updates:
  - package-ecosystem: bun
    directory: /
    exclude-paths:
      - packages/docs/**
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 4
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '@lastshotlabs/*'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /packages/docs
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: America/New_York
    open-pull-requests-limit: 4
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '@lastshotlabs/*'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns:
          - '*'
