name: CI

on:
  pull_request:
    branches: [main]

jobs:
  hardening-core:
    name: Hardening Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: packages/docs
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck root
        run: bun run typecheck:root

      - name: Test
        run: bun run test

  docs-and-deps:
    name: Docs & Dependency Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Dependency cruiser
        run: bun run lint:deps

      - name: Docs CI
        run: bun run docs:ci

  entity-conformance:
    name: Entity Conformance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slingshot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slingshot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Generate entity conformance report
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5433/slingshot_test
          TEST_MONGO_URL: mongodb://localhost:27018/slingshot_test
          TEST_REDIS_URL: redis://localhost:6380
        run: bun run entity:conformance:report

      - name: Upload entity conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-conformance
          path: .tmp/entity-conformance/entity-conformance.v2.json
          if-no-files-found: error
