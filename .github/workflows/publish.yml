name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Configure npm for the public registry
        # Write to $HOME/.npmrc so authentication is available from the
        # per-package staging directories used by scripts/publish.ts.
        run: |
          echo "@lastshotlabs:registry=https://registry.npmjs.org" > $HOME/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> $HOME/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to public npm
        run: bun scripts/publish.ts --target=npm --publish --skip-existing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
